<style>
/* =============================================================================
   KANBAN BOARD – Custom CSS Overrides (Stylesheet.html)
   =============================================================================
   These styles complement Tailwind CSS and add enterprise-grade visual polish.
   ============================================================================= */

/* ── Base & Typography ─────────────────────────────────────────────────────── */

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Kanban Column ─────────────────────────────────────────────────────────── */

.kanban-col {
  min-height: 480px;
  transition: box-shadow 0.2s ease;
}

.kanban-col:hover {
  box-shadow: 0 4px 24px rgba(79, 70, 229, 0.08);
}

/* Column header gradient accents */
#col-todo     + * .col-header,
.kanban-col:nth-child(1) .col-header { border-top: 3px solid #94A3B8; border-radius: 16px 16px 0 0; }
.kanban-col:nth-child(2) .col-header { border-top: 3px solid #F59E0B; border-radius: 16px 16px 0 0; }
.kanban-col:nth-child(3) .col-header { border-top: 3px solid #10B981; border-radius: 16px 16px 0 0; }

/* ── Task Card ─────────────────────────────────────────────────────────────── */

.task-card {
  border-left: 3px solid #6366F1;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
}

.task-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.12);
}

/* ── Done State Visual Cue ─────────────────────────────────────────────────── */

/**
 * Applied automatically when a card is dragged into the "Done" column,
 * or pre-applied on load for tasks already in Done status.
 */
.task-done {
  opacity: 0.55;
  border-left-color: #10B981;
}

.task-done .task-title {
  text-decoration: line-through;
  color: #64748b;
}

/* ── SortableJS Ghost & Drag ───────────────────────────────────────────────── */

.sortable-ghost {
  opacity: 0.35;
  background: #E0E7FF !important;
  border: 2px dashed #6366F1 !important;
  border-radius: 12px;
}

.sortable-drag {
  opacity: 0.95 !important;
  box-shadow: 0 12px 32px rgba(99, 102, 241, 0.25) !important;
  transform: rotate(1.5deg);
  cursor: grabbing;
}

/* ── Drop Zone Highlight ───────────────────────────────────────────────────── */

.task-list.sortable-over {
  background: rgba(99, 102, 241, 0.04);
  border-radius: 12px;
  outline: 2px dashed #A5B4FC;
}

/* ── Scrollbar (for long column lists) ────────────────────────────────────── */

.task-list {
  overflow-y: auto;
  max-height: calc(100vh - 220px);
  scrollbar-width: thin;
  scrollbar-color: #C7D2FE transparent;
}

.task-list::-webkit-scrollbar {
  width: 5px;
}

.task-list::-webkit-scrollbar-track {
  background: transparent;
}

.task-list::-webkit-scrollbar-thumb {
  background: #C7D2FE;
  border-radius: 99px;
}

/* ── Modals ────────────────────────────────────────────────────────────────── */

#task-modal,
#report-modal {
  backdrop-filter: blur(4px);
  animation: fadeInOverlay 0.18s ease;
}

@keyframes fadeInOverlay {
  from { opacity: 0; }
  to   { opacity: 1; }
}

#task-modal > div,
#report-modal > div {
  animation: slideUpModal 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUpModal {
  from { transform: translateY(32px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ── Loading Spinner ────────────────────────────────────────────────────────── */

#loading-overlay {
  transition: opacity 0.25s ease;
}

/* ── Filter Bar ─────────────────────────────────────────────────────────────── */

#filter-bar select:focus {
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

/* ── AI Section ─────────────────────────────────────────────────────────────── */

#ai-section {
  border-left: 3px solid #6366F1;
}

/* ── Report Table ───────────────────────────────────────────────────────────── */

#report-table-body tr:last-child td:first-child {
  border-radius: 0 0 0 8px;
}

#report-table-body tr:last-child td:last-child {
  border-radius: 0 0 8px 0;
}

/* ── Responsive Adjustments ─────────────────────────────────────────────────── */

@media (max-width: 768px) {
  .task-list {
    max-height: 320px;
  }

  #filter-bar {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  nav .flex.items-center.gap-4 {
    gap: 8px;
  }
}

/* ── Utility: line-clamp for description preview ────────────────────────────── */

.line-clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── SweetAlert2 custom z-index (above modals) ──────────────────────────────── */

.swal2-container {
  z-index: 9999 !important;
}
</style>
