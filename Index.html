<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Project Board</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Custom styles -->
  <?!= include('Stylesheet') ?>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- ═══════════════════════════════════════════════════════════
       TOP NAVIGATION BAR
  ═══════════════════════════════════════════════════════════ -->
  <nav class="bg-indigo-700 shadow-lg px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <!-- Logo / App name -->
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
      </svg>
      <span class="text-white text-xl font-bold tracking-wide">KanbanBoard</span>
    </div>

    <div class="flex items-center gap-4">
      <!-- Role badge -->
      <span id="role-badge"
        class="hidden px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500 text-white border border-indigo-300">
      </span>
      <!-- User email -->
      <span id="user-email" class="text-indigo-200 text-sm hidden"></span>

      <!-- Report button -->
      <button id="btn-report"
        class="hidden bg-white text-indigo-700 font-semibold text-sm px-4 py-1.5 rounded-lg shadow hover:bg-indigo-50 transition"
        onclick="openReportModal()">
        📊 Report
      </button>

      <!-- Create Task -->
      <button id="btn-create"
        class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm px-4 py-1.5 rounded-lg shadow transition"
        onclick="openCreateTaskModal()">
        + New Task
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════
       FILTER BAR (visible to Main Lead / Lead)
  ═══════════════════════════════════════════════════════════ -->
  <div id="filter-bar" class="hidden bg-white border-b border-slate-200 px-6 py-3 flex flex-wrap items-center gap-4 shadow-sm">
    <label class="text-sm font-medium text-slate-600">Filter by Assignee:</label>
    <select id="filter-assignee"
      class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white"
      onchange="applyFilters()">
      <option value="">All Assignees</option>
    </select>

    <label class="text-sm font-medium text-slate-600">Team:</label>
    <select id="filter-team"
      class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white"
      onchange="applyFilters()">
      <option value="">All Teams</option>
    </select>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       LOADING OVERLAY
  ═══════════════════════════════════════════════════════════ -->
  <div id="loading-overlay"
    class="fixed inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-50">
    <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-indigo-700 font-semibold text-lg">Loading your board…</p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       KANBAN BOARD
  ═══════════════════════════════════════════════════════════ -->
  <main class="p-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kanban-board">

      <!-- To-Do Column -->
      <div class="kanban-col bg-white rounded-2xl shadow-md flex flex-col">
        <div class="col-header flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-slate-400 inline-block"></span>
            <h2 class="font-bold text-slate-700 text-base">To-Do</h2>
          </div>
          <span id="count-todo" class="text-xs font-semibold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">0</span>
        </div>
        <ul id="col-todo" class="task-list flex-1 p-4 min-h-[200px] space-y-3" data-status="To-Do">
          <!-- Task cards injected here -->
        </ul>
      </div>

      <!-- In-Progress Column -->
      <div class="kanban-col bg-white rounded-2xl shadow-md flex flex-col">
        <div class="col-header flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>
            <h2 class="font-bold text-slate-700 text-base">In Progress</h2>
          </div>
          <span id="count-inprogress" class="text-xs font-semibold bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full">0</span>
        </div>
        <ul id="col-inprogress" class="task-list flex-1 p-4 min-h-[200px] space-y-3" data-status="In-Progress">
        </ul>
      </div>

      <!-- Done Column -->
      <div class="kanban-col bg-white rounded-2xl shadow-md flex flex-col">
        <div class="col-header flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
            <h2 class="font-bold text-slate-700 text-base">Done</h2>
          </div>
          <span id="count-done" class="text-xs font-semibold bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full">0</span>
        </div>
        <ul id="col-done" class="task-list flex-1 p-4 min-h-[200px] space-y-3" data-status="Done">
        </ul>
      </div>

    </div><!-- /kanban-board -->
  </main>

  <!-- ═══════════════════════════════════════════════════════════
       CREATE / EDIT TASK MODAL  (hidden by default)
  ═══════════════════════════════════════════════════════════ -->
  <div id="task-modal"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">

      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800">Create Task</h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>

      <form id="task-form" class="px-6 py-5 space-y-4" onsubmit="submitTaskForm(event)">
        <!-- Hidden fields -->
        <input type="hidden" id="form-task-id" />
        <input type="hidden" id="form-mode" value="create" />

        <!-- Title -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Title <span class="text-red-500">*</span></label>
          <input id="form-title" type="text" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            placeholder="Task title" />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
          <textarea id="form-description" rows="3"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
            placeholder="Describe the task…"></textarea>
        </div>

        <!-- Assignee (hidden for Employee) -->
        <div id="assignee-field">
          <label class="block text-sm font-medium text-slate-700 mb-1">Assignee</label>
          <select id="form-assignee"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
          </select>
        </div>

        <!-- Due Date -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
          <input id="form-due-date" type="date"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <!-- AI Task Chunking (only in create mode) -->
        <div id="ai-section" class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-indigo-600 text-lg">✨</span>
              <span class="text-sm font-semibold text-indigo-700">AI Task Breakdown</span>
            </div>
            <button type="button" id="btn-ai-suggest"
              onclick="requestAISuggestions()"
              class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-lg transition font-medium">
              Suggest Sub-tasks
            </button>
          </div>
          <p class="text-xs text-indigo-500">Let Gemini AI break this task into smaller sub-tasks with intermediate deadlines.</p>

          <!-- AI results area -->
          <div id="ai-results" class="hidden mt-3 space-y-2"></div>

          <!-- Accept & Split button -->
          <button type="button" id="btn-accept-split"
            onclick="acceptAndSplit()"
            class="hidden mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2 rounded-lg transition">
            ✅ Accept &amp; Split into Sub-tasks
          </button>
        </div>

        <!-- Form actions -->
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeTaskModal()"
            class="px-4 py-2 text-sm font-medium text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50 transition">
            Cancel
          </button>
          <button type="submit" id="form-submit-btn"
            class="px-5 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">
            Create Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       REPORT MODAL
  ═══════════════════════════════════════════════════════════ -->
  <div id="report-modal"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">

      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800">📊 Weekly Report</h3>
        <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </div>

      <div class="px-6 py-5">
        <!-- Loading state -->
        <div id="report-loading" class="flex items-center justify-center py-12">
          <div class="w-10 h-10 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- Report content -->
        <div id="report-content" class="hidden">
          <p id="report-week-range" class="text-sm text-slate-500 mb-4"></p>

          <!-- Chart -->
          <div class="flex justify-center mb-6">
            <div class="relative w-48 h-48">
              <canvas id="report-chart"></canvas>
            </div>
          </div>

          <!-- Summary table -->
          <div class="overflow-x-auto">
            <table class="w-full text-sm border-collapse">
              <thead>
                <tr class="bg-indigo-600 text-white">
                  <th class="px-4 py-2 text-left rounded-tl-lg">Assignee</th>
                  <th class="px-4 py-2 text-center">Done</th>
                  <th class="px-4 py-2 text-center">In-Progress</th>
                  <th class="px-4 py-2 text-center">To-Do</th>
                  <th class="px-4 py-2 text-center rounded-tr-lg">Total</th>
                </tr>
              </thead>
              <tbody id="report-table-body"></tbody>
            </table>
          </div>

          <!-- Export button -->
          <div class="flex justify-end mt-5">
            <button onclick="exportReportPDF()"
              class="flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition">
              ⬇️ Export as PDF
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════════════════ -->
  <?!= include('JavaScript') ?>

</body>
</html>
